name: publish-development-android

# Builds the Android app in Release mode as a signed .aab, uploads it to the
# Google Play closed testing ("alpha") track and auto-increments the app version
# in the .csproj.
#
# All required secrets live in the "googleplay" repository environment.
# See docs/publish-development-android.md for what each secret is and how to get it.

on:
  push:
    branches:
      - publish-development
  workflow_dispatch:
    inputs:
      track:
        description: Google Play track to publish to
        type: choice
        default: alpha
        options:
          - internal
          - alpha
          - beta
          - production
      status:
        description: Release status on that track
        type: choice
        default: completed
        options:
          - completed # rolled out to that track's testers immediately
          - draft # sits in the Play Console until you press "Rollout"

permissions:
  contents: write # needed to push the version bump commit back to the branch

# Never run two publishes at once - the version bump commit and the Play version
# codes must stay strictly sequential. The group is shared with
# publish-development-ios.yaml, which bumps the same csproj version: the two
# publishes queue behind each other instead of racing to push.
concurrency:
  group: publish-development
  cancel-in-progress: false

jobs:
  publish-android:
    runs-on: ubuntu-latest
    environment: googleplay
    timeout-minutes: 120

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      PROJECT: XcavateMobileApp/XcavateMobileApp.csproj
      # Empty on a push event, so fall back to the same defaults as the inputs.
      TRACK: ${{ github.event.inputs.track || 'alpha' }}
      RELEASE_STATUS: ${{ github.event.inputs.status || 'completed' }}

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          # Always publish the tip of publish-development, also for manual runs.
          ref: publish-development
          submodules: recursive

      # The .NET 10 Android workload wants a JDK in [17.0, 22.0), and the
      # runner default drifts, so pin the version the workload recommends.
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Unlike the iOS workflow this does not use "dotnet workload restore":
      # that would resolve the csproj's net10.0-ios target framework as well,
      # and the iOS workload cannot be installed on a Linux runner.
      - name: Install required .NET workloads
        run: dotnet workload install maui-android

      # The runner ships an Android SDK, but not necessarily the platform the
      # current android workload compiles against. Installing it is a no-op
      # when it is already there.
      - name: Ensure the Android SDK has the platform this build needs
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found at $SDKMANAGER - relying on the preinstalled Android SDK."
            exit 0
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      # Fail fast on missing secrets, before a version number gets consumed.
      - name: Check required secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
          APPSETTINGS_JSON_BASE64: ${{ secrets.APPSETTINGS_JSON_BASE64 }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS \
                      ANDROID_KEY_PASSWORD GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 \
                      APPSETTINGS_JSON_BASE64 GOOGLE_SERVICES_JSON_BASE64; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is missing or empty. Add it to the googleplay environment (see docs/publish-development-android.md)."
              missing=1
            fi
          done
          exit $missing

      # Both files are gitignored (they contain API keys). appsettings.json is
      # embedded as a resource so the build fails without it; google-services.json
      # is the Android Firebase config the csproj turns into resource values -
      # without it FirebaseApp never initializes and FCM token retrieval fails.
      - name: Create appsettings.json and google-services.json
        env:
          APPSETTINGS_JSON_BASE64: ${{ secrets.APPSETTINGS_JSON_BASE64 }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo -n "$APPSETTINGS_JSON_BASE64" | base64 --decode > XcavateMobileApp/appsettings.json
          echo -n "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > XcavateMobileApp/Platforms/Android/google-services.json

      - name: Bump app version
        id: bump
        run: python3 .github/scripts/bump_app_version.py "$PROJECT"

      # The bump is committed and pushed BEFORE the build so that every run -
      # even one that later fails - consumes its version code exactly once.
      # Google Play rejects an upload that reuses a version code, so monotonic
      # numbering matters more than a pretty history.
      # "[skip ci]" prevents the push from re-triggering this workflow.
      - name: Commit and push version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898270+github-actions[bot]@users.noreply.github.com"
          git add "$PROJECT"
          git commit -m "Bump app version to ${{ steps.bump.outputs.display_version }} (build ${{ steps.bump.outputs.build_number }}) [skip ci]"
          git pull --rebase origin publish-development
          git push origin HEAD:publish-development

      - name: Restore the upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/realxmarket.keystore"
          echo -n "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 decoded to an empty file - re-encode the keystore (see docs/publish-development-android.md)."
            exit 1
          fi
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      # The two passwords are handed over as "env:<NAME>" rather than as literal
      # values, so they never reach the build log or the process list and
      # special characters in them need no escaping.
      - name: Publish Android app (Release, signed .aab)
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          dotnet publish "$PROJECT" \
            -f net10.0-android \
            -c Release \
            -p:AndroidPackageFormat=aab \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$KEYSTORE_PATH" \
            -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS" \
            -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD \
            -p:AndroidSigningKeyPass=env:ANDROID_KEY_PASSWORD

      - name: Locate .aab
        id: aab
        run: |
          # No pipefail here: "find | head -n 1" can leave find killed by
          # SIGPIPE once head has its line, which pipefail would treat as a
          # step failure.
          set -eu
          AAB_PATH=$(find XcavateMobileApp/bin/Release/net10.0-android -name '*-Signed.aab' | head -n 1)
          if [ -z "$AAB_PATH" ]; then
            AAB_PATH=$(find XcavateMobileApp/bin/Release/net10.0-android -name '*.aab' | head -n 1)
          fi
          if [ -z "$AAB_PATH" ]; then
            echo "::error::No .aab produced by the publish step."
            exit 1
          fi
          # Read the package name out of the csproj so it stays defined in
          # exactly one place.
          PACKAGE_NAME=$(sed -n 's:.*<ApplicationId>\(.*\)</ApplicationId>.*:\1:p' "$PROJECT" | head -n 1)
          if [ -z "$PACKAGE_NAME" ]; then
            echo "::error::No <ApplicationId> found in $PROJECT."
            exit 1
          fi
          echo "Found $AAB_PATH for $PACKAGE_NAME"
          echo "aab_path=$AAB_PATH" >> "$GITHUB_OUTPUT"
          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload .aab as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: realxmarket-android-${{ steps.bump.outputs.display_version }}-build${{ steps.bump.outputs.build_number }}
          path: ${{ steps.aab.outputs.aab_path }}
          retention-days: 30

      - name: Setup Python for the Play upload
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the Google Play API client
        run: pip install --quiet google-api-python-client google-auth

      - name: Upload to Google Play
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          python3 .github/scripts/upload_to_play.py "${{ steps.aab.outputs.aab_path }}" \
            --package-name "${{ steps.aab.outputs.package_name }}" \
            --track "$TRACK" \
            --status "$RELEASE_STATUS" \
            --release-name "${{ steps.bump.outputs.display_version }} (${{ steps.bump.outputs.build_number }})"

      - name: Clean up signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/realxmarket.keystore"
